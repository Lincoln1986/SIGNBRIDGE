version: "3.9"

services:
  mysql:
    image: mysql:8
    container_name: signbridge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: signbridge
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: signbridge_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: signbridge_mongo_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin

  redis:
    image: redis:7
    container_name: signbridge_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass admin
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:17
    container_name: signbridge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: signbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../Backend-signbringe
      dockerfile: Dockerfile
    container_name: signbridge_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../Backend-signbringe:/app
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/signbridge
      SECRET_KEY: cualquier_clave_larga_aqui_ej_signbridge2026
      MAIL_USERNAME: bfde1fb57370b5
      MAIL_PASSWORD: d45df76c4baced
      MAIL_FROM: noreply@signbridge.com
      MAIL_SERVER: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres

  frontend:
    build:
      context: ../signbridge-frontend
      dockerfile: Dockerfile
    container_name: signbridge_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ../signbridge-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  postgres_data: