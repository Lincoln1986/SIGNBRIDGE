services:
  postgres:
    image: postgres:17
    container_name: signbridge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: signbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./Backend-SignBridge:/app
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/signbridge
      SECRET_KEY: cualquier_clave_larga_aqui_ej_signbridge2026
      MAIL_USERNAME: bfde1fb57370b5
      MAIL_PASSWORD: d45df76c4baced
      MAIL_FROM: noreply@signbridge.com
      MAIL_SERVER: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres

  frontend:
    build:
      context: ./Frontend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./Frontend-SignBridge:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
