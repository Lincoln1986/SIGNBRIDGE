# ==============================================================================
# SignBridge — stack completo (PostgreSQL + backend FastAPI + frontend Vite)
#
#   cp .env.example .env      # y editá SECRET_KEY
#   docker compose up -d --build
#
# Las imágenes son de producción: el backend no se recarga solo y el frontend
# es la versión compilada. Para desarrollar con recarga automática, correr cada
# parte en local (uv run uvicorn app.main:app --reload / pnpm dev).
#
#   Frontend  → http://localhost:5173
#   API docs  → http://localhost:8000/docs
# ==============================================================================

services:
  postgres:
    image: postgres:17
    container_name: signbridge_postgres
    restart: unless-stopped
    networks:
      - db_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-signbridge}
    # Solo accesible desde la red interna db_network (backend) y desde el
    # propio host para cargar respaldos: no se expone a la red pública.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-signbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Postgres SOLO para las pruebas de integración (S5). Puerto 5433 para no
  # chocar con el de desarrollo, datos en memoria (tmpfs) para que cada vez
  # arranque vacío, y perfil "test" para que `docker compose up` normal no lo
  # levante. Uso:
  #   docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:17
    container_name: signbridge_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: signbridge_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signbridge_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-signbridge}
      SECRET_KEY: ${SECRET_KEY:?falta SECRET_KEY - copiá .env.example a .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOGIN_MAX_INTENTOS_CORREO: ${LOGIN_MAX_INTENTOS_CORREO:-5}
      LOGIN_MAX_INTENTOS_IP: ${LOGIN_MAX_INTENTOS_IP:-20}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS:-15}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@signbridge.com}
      MAIL_SERVER: ${MAIL_SERVER:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      APP_NAME: ${APP_NAME:-Sign_Bridge}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    # Espera a que Postgres acepte conexiones, no solo a que arranque el
    # contenedor: de lo contrario el backend entra en un bucle de reinicios.
    depends_on:
      postgres:
        condition: service_healthy
    # La imagen ya trae el arranque (alembic upgrade head + uvicorn) y su
    # HEALTHCHECK contra /health: ver Backend-SignBridge/Dockerfile.
    networks:
      - web_network
      - db_network

  frontend:
    build:
      context: ./Frontend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_frontend
    restart: unless-stopped
    # nginx dentro del contenedor escucha en 8080 (usuario sin privilegios).
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web_network

volumes:
  postgres_data:

# Segmentación de tráfico:
#   web_network  → proxy/app (frontend ↔ backend). Nunca toca la base de datos.
#   db_network   → red interna hermética (backend ↔ postgres). Sin salida a
#                  internet público: PostgreSQL solo escucha en esta red y en
#                  127.0.0.1 del host.
networks:
  web_network:
    driver: bridge
  db_network:
    driver: bridge
    internal: true
