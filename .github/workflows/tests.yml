## Checklist

- [ ] La base del PR es `develop` (o `main` solo si es el release)
- [ ] El título y los commits siguen `tipo(alcance): qué cambia` (ver `docs/guia-commits.md`)
- [ ] Los tests siguen el patrón AAA (Arrange, Act, Assert)
- [ ] Los nombres de los tests describen el comportamiento esperado
- [ ] Hice fallar cada test al menos una vez para comprobar que detecta el error (mutante)
- [ ] Los tests pasan en local
- [ ] No hay credenciales ni datos reales

