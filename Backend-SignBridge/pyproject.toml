[project]
name = "signbridge-backend"
version = "1.0.0"
description = "API REST SignBridge — traducción texto/voz <-> LSC (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.31",
    "aiosmtplib==5.1.2",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "bcrypt==4.0.1",
    "Pillow==12.3.0",
    "numpy==1.26.4",
    "mediapipe==0.10.14",
    "alembic==1.15.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "pip-audit==2.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# cov-fail-under: trinquete de cobertura. Sube en cada sprint, nunca baja.
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=55"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
