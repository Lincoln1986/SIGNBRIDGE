[project]
name = "signbridge-backend"
version = "1.0.0"
description = "API REST SignBridge — traducción texto/voz <-> LSC (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.2.1",
    "PyJWT==2.15.1",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.31",
    "aiosmtplib==5.1.2",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "bcrypt==4.0.1",
    "Pillow==13.0.0",
    "numpy==1.26.4",
    "mediapipe==0.10.14",
    "alembic==1.15.2",
    "reportlab==4.5.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "pip-audit==2.9.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Errores críticos: sintaxis (E9), imports mal ubicados o sin usar (E4, F401),
# comparaciones y lambdas peligrosas (E7) y nombres indefinidos (F).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# cov-fail-under: trinquete de cobertura. Sube en cada sprint, nunca baja.
# Cierre S7 (20 nov): real 88.09 → 88.
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=88"
markers = [
    "integracion: pruebas contra PostgreSQL real; necesitan TEST_DATABASE_URL",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
